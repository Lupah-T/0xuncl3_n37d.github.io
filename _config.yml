# 1. Tell Jekyll to fetch layout properties remotely over HTTPS
# 1. We are using local layouts now, so we remove remote_theme and use the theme gem
# 1. Instruct Jekyll to pull the layout definitions remotely over HTTPS
remote_theme: cotes2020/jekyll-theme-chirpy

# 2. Set up the exact plugins Vercel needs to render it
plugins:
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-remote-theme    # <--- This plugin is CRITICAL for Vercel
  - jekyll-sitemap
  - jekyll-seo-tag

# <--- This line allows Vercel to pull layout structures dynamically

